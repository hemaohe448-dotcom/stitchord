services:
  api:
    build:
      context: ../services/digitizer
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      STITCHORD_CORS_ORIGINS: http://localhost:5173
      STITCHORD_WORK_DIR: /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: node:22-slim
    working_dir: /repo
    volumes:
      - ..:/repo
    command: sh -c "npm ci && npm run dev -w @stitchord/web -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""

