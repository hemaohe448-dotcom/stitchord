[project]
name = "stitchord-digitizer"
version = "0.1.0"
description = "Stitchord digitizing worker: file IO, stitch plan, machine-format validation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyembroidery>=1.5",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "Pillow>=10",
  "vtracer>=0.6.15",
  "svgelements>=1.9.6",
  "reportlab>=4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
