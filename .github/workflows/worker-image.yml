name: worker-image

# Manual gate: builds the Linux worker image and proves /v1/digitize works
# inside it. Not run on every push because it downloads Ink/Stitch + wx/GTK.
on:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --progress=plain -t stitchord-digitizer ./services/digitizer

      - name: Run container
        run: |
          docker run -d --name digitizer -p 8000:8000 stitchord-digitizer
          docker ps

      - name: Smoke test
        run: python3 tools/e2e/docker_smoke.py

      - name: Container logs on failure
        if: failure()
        run: docker logs digitizer || true

      - name: Cleanup
        if: always()
        run: docker rm -f digitizer || true
