name: worker-image

# Manual gate: builds the Linux worker image and proves /v1/digitize works
# inside it. Not run on every push because it downloads Ink/Stitch + wx/GTK.
on:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --progress=plain -t stitchord-digitizer ./services/digitizer

      - name: Import check
        run: docker run --rm stitchord-digitizer python -c "import app.main; print('app import ok')"

      - name: Run container
        run: |
          docker run -d --name digitizer -p 8000:8000 stitchord-digitizer
          docker ps

      - name: Smoke test
        run: |
          set -o pipefail
          python3 tools/e2e/docker_smoke.py 2>&1 | tee smoke.log

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs digitizer > container.log 2>&1 || true
          tail -200 container.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-image-diagnostics
          path: |
            smoke.log
            container.log
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker rm -f digitizer || true
